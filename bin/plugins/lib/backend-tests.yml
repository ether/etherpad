name: Backend Tests

# any branch is useful for testing before a PR is submitted
on:
  workflow_call:

jobs:
  withplugins:
    # run on pushes to any branch
    # run on PRs from external forks
    if: |
      (github.event_name != 'pull_request')
      || (github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id)
    name: with Plugins (Node ${{ matrix.node }} / core ${{ matrix.core_ref || 'develop' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Plugin floor is engines.node >=22 but current Etherpad core
      # requires >=24 (engineStrict). Each cell pairs a Node version
      # with a core ref that actually allows it: Node 22 against the
      # last tag whose core floor was 22 (v2.7.3); Node 24 / 26 against
      # current develop.
      matrix:
        include:
          - node: '22'
            core_ref: 'v2.7.3'
          - node: '24'
            core_ref: ''
          - node: '26'
            core_ref: ''
    steps:
      -
        name: Install libreoffice
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libreoffice libreoffice-pdfimport
          version: 1.0
      -
        name: Install etherpad core
        uses: actions/checkout@v7
        with:
          repository: ether/etherpad-lite
          ref: ${{ matrix.core_ref }}
          path: etherpad-lite
      - uses: actions/setup-node@v7
        name: Install Node.js
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          package_json_file: ./etherpad-lite/package.json
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      -
        name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          path: plugin
      - name: Remove tests
        working-directory: ./etherpad-lite
        run: rm -rf ./src/tests/backend/specs
      -
        name: Install Etherpad core dependencies
        working-directory: ./etherpad-lite
        run: bin/installDeps.sh
      - name: Install plugin
        working-directory: ./etherpad-lite
        run: |
          pnpm run plugins i --path  ../../plugin
      -
        name: Run the backend tests
        working-directory: ./etherpad-lite/src
        run: |
          shopt -s globstar
          res=$(find ./plugin_packages -path "*/static/tests/backend/specs/*" 2>/dev/null | wc -l)
          if [ $res -eq 0 ]; then
          echo "No backend tests found"
          else
          npx cross-env NODE_ENV=production mocha --import=tsx --timeout 120000 --recursive node_modules/ep_*/static/tests/backend/specs/**
          fi
