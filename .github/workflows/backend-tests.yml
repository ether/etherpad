name: "Backend tests"

# any branch is useful for testing before a PR is submitted
# No paths-ignore: the Linux jobs are required status checks on develop (so
# Dependabot auto-merge waits for them). A skipped workflow never reports, which
# would leave docs-only PRs blocked forever.
on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  withoutpluginsLinux:
    env:
      PNPM_HOME: ~/.pnpm-store
    # run on pushes to any branch
    # run on PRs from external forks
    if: |
      (github.event_name != 'pull_request')
      || (github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id)
    name: Linux without plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Etherpad requires Node >= 24 (see package.json engines.node). Test the
        # floor (24) and the current Active LTS (26).
        node: ${{ fromJSON('[24, 26]') }}
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Cache pnpm store
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      -
        name: Install libreoffice
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libreoffice libreoffice-pdfimport
          version: 1.0
      -
        name: Install all dependencies and symlink for ep_etherpad-lite
        run: pnpm i --frozen-lockfile
      - name: Install admin ui
        working-directory: admin
        run: pnpm install
      - name: Build admin ui
        working-directory: admin
        run: pnpm build
      -
        name: Run the backend tests
        run: pnpm test
      - name: Run the new vitest tests
        working-directory: src
        run: pnpm run test:vitest

  withpluginsLinux:
    env:
      PNPM_HOME: ~/.pnpm-store
    # run on pushes to any branch
    # run on PRs from external forks
    if: |
      (github.event_name != 'pull_request')
      || (github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id)
    name: Linux with Plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON('[24, 26]') }}
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Cache pnpm store
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      -
        name: Install libreoffice
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libreoffice libreoffice-pdfimport
          version: 1.0
      -
        name: Install all dependencies and symlink for ep_etherpad-lite
        run: pnpm install --frozen-lockfile
      - name: Build admin ui
        working-directory: admin
        run: pnpm build
      -
        name: Install Etherpad plugins
        run: >
          pnpm add -w
          ep_ai_core
          ep_ai_mcp
          ep_align
          ep_author_hover
          ep_cursortrace
          ep_font_color
          ep_font_size
          ep_hash_auth
          ep_headings2
          ep_markdown
          ep_guest
          ep_post_data
          ep_set_title_on_pad
          ep_spellcheck
          ep_subscript_and_superscript
          ep_table_of_contents
      -
        name: Run the backend tests
        run: pnpm test
      - name: Run the new vitest tests
        working-directory: src
        run: pnpm run test:vitest

  # Windows tests only run on push to develop/master, not on PRs
  withoutpluginsWindows:
    env:
      PNPM_HOME: ~\\.pnpm-store
    if: |
      github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Etherpad requires Node >= 24 (see package.json engines.node). Test the
        # floor (24) and the current Active LTS (26).
        # Windows needs libuv >= 1.52.1 (Node >= 24.16.0). Node 24.15.0's
        # bundled libuv 1.51.0 has a stack buffer overrun in the Windows
        # TCP-connect path (uv__tcp_connect) that the backend suite's localhost
        # connection churn hits as a silent ELIFECYCLE crash
        # (nodejs/node#63620, fixed in 24.16.0). The runner image can still
        # pre-cache 24.15.0 for a bare "24", so this job sets check-latest: true
        # to always resolve the newest 24.x / 26.x release instead of pinning.
        node: ${{ fromJSON('[24, 26]') }}
    name: Windows without plugins
    runs-on: windows-latest
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Cache pnpm store
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      -
        name: Install all dependencies and symlink for ep_etherpad-lite
        run: pnpm install --frozen-lockfile
      - name: Build admin ui
        working-directory: admin
        run: pnpm build
      -
        name:  Fix up the settings.json
        run: |
          powershell -Command "(gc settings.json.template) -replace '\"max\": 10', '\"max\": 10000' | Out-File -encoding ASCII settings.json.holder"
          powershell -Command "(gc settings.json.holder) -replace '\"points\": 10', '\"points\": 1000' | Out-File -encoding ASCII settings.json"
      -
        name: Run the backend tests
        shell: bash
        working-directory: src
        # --exit makes mocha call process.exit() after the run so a leaked handle
        # cannot hang the job on Windows.
        run: pnpm test -- --exit
      - name: Run the new vitest tests
        working-directory: src
        run: pnpm run test:vitest

  withpluginsWindows:
    env:
      PNPM_HOME: ~\\.pnpm-store
    if: |
      github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Etherpad requires Node >= 24 (see package.json engines.node). Test the
        # floor (24) and the current Active LTS (26).
        # Windows needs libuv >= 1.52.1 (Node >= 24.16.0). Node 24.15.0's
        # bundled libuv 1.51.0 has a stack buffer overrun in the Windows
        # TCP-connect path (uv__tcp_connect) that the backend suite's localhost
        # connection churn hits as a silent ELIFECYCLE crash
        # (nodejs/node#63620, fixed in 24.16.0). The runner image can still
        # pre-cache 24.15.0 for a bare "24", so this job sets check-latest: true
        # to always resolve the newest 24.x / 26.x release instead of pinning.
        node: ${{ fromJSON('[24, 26]') }}
    name: Windows with Plugins
    runs-on: windows-latest

    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Cache pnpm store
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build admin ui
        working-directory: admin
        run: pnpm build
      -
        name: Install Etherpad plugins
        run: >
          pnpm add -w
          ep_ai_core
          ep_ai_mcp
          ep_align
          ep_author_hover
          ep_cursortrace
          ep_font_color
          ep_font_size
          ep_hash_auth
          ep_headings2
          ep_markdown
          ep_guest
          ep_post_data
          ep_set_title_on_pad
          ep_spellcheck
          ep_subscript_and_superscript
          ep_table_of_contents
      # Etherpad core dependencies must be installed after installing the
      # plugin's dependencies, otherwise npm will try to hoist common
      # dependencies by removing them from src/node_modules and installing them
      # in the top-level node_modules. As of v6.14.10, npm's hoist logic appears
      # to be buggy, because it sometimes removes dependencies from
      # src/node_modules but fails to add them to the top-level node_modules.
      # Even if npm correctly hoists the dependencies, the hoisting seems to
      # confuse tools such as `npm outdated`, `npm update`, and some ESLint
      # rules.
      -
        name: Install all dependencies and symlink for ep_etherpad-lite
        run: pnpm install --frozen-lockfile
      -
        name:  Fix up the settings.json
        run: |
          powershell -Command "(gc settings.json.template) -replace '\"max\": 10', '\"max\": 10000' | Out-File -encoding ASCII settings.json.holder"
          powershell -Command "(gc settings.json.holder) -replace '\"points\": 10', '\"points\": 1000' | Out-File -encoding ASCII settings.json"
      -
        name: Run the backend tests
        shell: bash
        working-directory: src
        # --exit makes mocha call process.exit() after the run so a leaked handle
        # cannot hang the job on Windows.
        run: pnpm test -- --exit
      - name: Run the new vitest tests
        working-directory: src
        run: pnpm run test:vitest
